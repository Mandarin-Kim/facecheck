<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body style="margin:0"><title>페이스체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>

/* Layout: personal report you would screenshot — inputs, then age hero + share card, beauty metrics, visual health signals (each with its raw number and literature), vitals, raw data; pilot data store at the end. */
:root{
  --bg:#f4f6f5; --paper:#ffffff; --ink:#14201b; --muted:#5b6b65; --line:#dfe6e2; --soft:#eaf1ed;
  --accent:#16825a; --accent-ink:#ffffff; --good:#16825a; --mid:#c98a12; --care:#d0533e; --urgent:#b3261e;
  --f-display:"Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1513;--paper:#161e1b;--ink:#e3ebe7;--muted:#99aaa3;--line:#27332e;--soft:#1c2925;--accent:#3fbf86;--accent-ink:#06150e;--good:#3fbf86;--mid:#e3a83a;--care:#f0806c;--urgent:#ff6b5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1513;--paper:#161e1b;--ink:#e3ebe7;--muted:#99aaa3;--line:#27332e;--soft:#1c2925;--accent:#3fbf86;--accent-ink:#06150e;--good:#3fbf86;--mid:#e3a83a;--care:#f0806c;--urgent:#ff6b5e;color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.6}
.wrap{max-width:940px;margin:0 auto;padding-inline:16px;padding-block:22px 56px;display:grid;gap:18px}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);margin:0}
header p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:680px){.steps{grid-template-columns:1fr}}
.step{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.step h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step h3 .n{font-family:var(--f-num);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;width:22px;height:22px;display:inline-grid;place-items:center}
.step p{margin:0;font-size:13px;color:var(--muted)}
.opt{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input[type=number],select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.btn,.filebtn{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;position:relative;display:inline-flex;align-items:center;gap:6px;overflow:hidden}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.btn:focus-visible,.filebtn:focus-within,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{width:100%;max-width:180px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:4px}
.thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.status{font-size:13px;color:var(--muted);min-height:1.3em;margin:0}
.status.ok{color:var(--good)} .status.warn{color:var(--care)}
.survey{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.survey label.f select{width:100%}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{margin-top:3px}
.go{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.consent{font-size:12.5px;color:var(--muted);max-width:62ch;margin:0}

.reportHead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ex{border-color:var(--mid);color:var(--mid)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:680px){.hero{grid-template-columns:1fr}}
.age{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.age .big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,13vw,104px);line-height:.9;color:var(--accent)}
.age .big small{font-size:.32em;color:var(--ink);margin-left:4px}
.age .real{font-size:14px;color:var(--muted);padding-bottom:10px}
.age .real b{font-family:var(--f-display);font-size:28px;color:var(--ink)}
.headline{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3.4vw,26px);line-height:1.4;margin:12px 0 6px;text-wrap:balance}
.summary{color:var(--muted);margin:0;max-width:58ch}
.factors{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.factors li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.factors .d{font-family:var(--f-num);min-width:3.4em;text-align:right}
.factors .d.up{color:var(--care)} .factors .d.dn{color:var(--good)}
.share img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.sec{margin-top:24px}
.metrics{display:grid}
.m{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
@media (max-width:560px){.m{grid-template-columns:1fr auto}.m .bar{grid-column:1/-1;grid-row:2}}
.m .name{font-weight:600;min-width:0}
.m .name small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);line-height:1.45}
.raw{font-family:var(--f-num);font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.bar{height:8px;border-radius:4px;background:var(--soft);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.chip{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;text-align:center}
.chip.g{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.chip.m{background:color-mix(in srgb,var(--mid) 16%,transparent);color:var(--mid)}
.chip.c{background:color-mix(in srgb,var(--care) 14%,transparent);color:var(--care)}
.chip.u{background:var(--urgent);color:#fff}
.chip.n{background:var(--soft);color:var(--muted)}
.signals{display:grid;gap:10px}
.sig{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.sig.c{border-left:4px solid var(--care)} .sig.m{border-left:4px solid var(--mid)} .sig.u{border-left:4px solid var(--urgent)}
.sig .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.sig .t{font-weight:700}
.sig .org{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.sig p{margin:0;font-size:14px}
.sig .ev{font-size:12.5px;color:var(--muted)}
.sig .ev a{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tips{margin:0;padding-left:20px;display:grid;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:680px){.grid2{grid-template-columns:1fr}}
.vit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vit div{border:1px solid var(--line);border-radius:10px;padding:10px}
.vit b{display:block;font-family:var(--f-display);font-size:28px}
.vit span{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table.raw2{width:100%;border-collapse:collapse;font-size:13px}
table.raw2 th,table.raw2 td{text-align:left;padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.raw2 th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
table.raw2 td.n{font-family:var(--f-num);white-space:nowrap}
.foot{font-size:12.5px;color:var(--muted);max-width:92ch}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1s infinite alternate}
@keyframes p{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpis div{border:1px solid var(--line);border-radius:10px;padding:10px}
.kpis b{font-family:var(--f-display);font-size:26px;display:block}
.kpis span{font-size:12px;color:var(--muted)}

/* App shell: a phone-width column with screens and a bottom tab bar; on desktop it sits centred like a device. */
body{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.topbar h1{font-family:var(--f-display);font-size:20px;margin:0;flex:1}
.topbar .back{background:none;border:0;font-size:22px;color:var(--ink);cursor:pointer;padding:0 6px}
.screens{flex:1;padding:16px 16px 96px;display:grid;gap:14px;align-content:start}
.screen{display:grid;gap:14px;align-content:start}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(var(--tabs,3),1fr);background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabbar button{background:none;border:0;padding:10px 0 12px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
.hello{font-family:var(--f-display);font-size:26px;font-weight:800;margin:4px 0 0;line-height:1.3}
.cta{width:100%;justify-content:center;font-size:16px;padding:14px}
.lastcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lastcard .num{font-family:var(--f-display);font-size:54px;font-weight:800;color:var(--accent);line-height:1}
.lastcard .num small{font-size:16px;color:var(--ink)}
.stepper{display:flex;gap:6px}
.stepper i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.stepper i.on{background:var(--accent)}
.stage2{position:relative;width:100%;aspect-ratio:3/4;background:#0b0f0d;border-radius:16px;overflow:hidden}
.stage2 video,.stage2 canvas,.stage2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage2.mirror video{transform:scaleX(-1)}
.guide{position:absolute;inset:0;pointer-events:none}
.stage2 .msg2{position:absolute;left:12px;right:12px;bottom:12px;color:#fff;font-size:13px;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.stage2 .badge{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-family:var(--f-num);font-size:12px;color:#fff}
.stage2 .badge span{background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px}
.stage2 .empty{position:absolute;inset:0;display:grid;place-items:center;color:#9fb3ab;text-align:center;padding:24px;font-size:14px}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid var(--accent);background:var(--paper);cursor:pointer;margin:0 auto;display:block}
.shutter:disabled{opacity:.4}
.actions2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wave2{width:100%;height:64px;display:block;background:#0b0f0d;border-radius:10px}
.hist{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.hrow .d{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.hrow b{font-family:var(--f-display);font-size:26px}
.spark{width:100%;height:90px;display:block}
.note2{font-size:12.5px;color:var(--muted);margin:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;max-width:440px;width:calc(100% - 32px);background:#2a1513;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;z-index:20}
details.diag{font-size:13px}
details.diag table{width:100%;border-collapse:collapse;margin-top:6px}
details.diag td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
details.diag td:last-child{text-align:right;font-family:var(--f-num);font-size:12px;word-break:break-all;padding-left:8px}
</style>

<div class="toast" id="toast" hidden role="alert"></div>
<div class="app">
  <div class="topbar"><button class="back" id="back" hidden aria-label="뒤로">‹</button><h1 id="title">페이스체크</h1><span class="pill" id="who">파일럿</span></div>

  <main class="screens">
    <!-- HOME -->
    <section class="screen" data-s="home">
      <div><p class="eyebrow" style="margin:0" id="today"></p><p class="hello">오늘 얼굴로<br>컨디션을 확인해 볼까요?</p></div>
      <div class="card" id="lastBox"></div>
      <div class="card" id="profileBox">
        <p class="eyebrow">내 정보</p>
        <div class="row">
          <label class="f" for="birth">출생 연도<input type="number" id="birth" min="1930" max="2012" placeholder="예: 1988" inputmode="numeric"></label>
          <label class="f" for="sex">성별<select id="sex"><option value="">선택 안 함</option><option value="여성">여성</option><option value="남성">남성</option></select></label>
        </div>
        <label class="check" style="margin-top:10px"><input type="checkbox" id="agree">파일럿 참여에 동의합니다. 사진은 분석에만 쓰이고 저장되지 않으며, 측정 수치·설문·AI 판독 결과만 익명 ID로 저장됩니다. 사진은 판독을 위해 Claude AI로 전송됩니다.</label>
      </div>
      <button class="btn primary cta" id="start" disabled>오늘의 체크 시작</button>
      <details class="diag card" id="diag"><summary>작동이 안 되나요? 환경 점검</summary><table id="diagT"></table><p class="note2" style="margin-top:8px">문제가 있으면 이 표를 캡처해서 보내 주세요.</p><button class="btn" id="camTest" style="margin-top:8px">카메라 미리보기 시험</button></details>
      <p class="note2">약 2분 · 정면 사진 1장은 필수, 나머지는 건너뛸 수 있어요. 결과는 건강관리 참고용이며 진단이 아닙니다.</p>
    </section>

    <!-- CAPTURE -->
    <section class="screen" data-s="capture" hidden>
      <div class="stepper" id="stepper"></div>
      <div><p class="eyebrow" style="margin:0" id="stepNo"></p><h2 style="margin:2px 0 4px;font-size:20px" id="stepTitle"></h2><p class="note2" id="stepDesc"></p></div>
      <div class="stage2" id="stage">
        <video id="live" playsinline muted></video>
        <canvas class="guide" id="guide"></canvas>
        <img id="shot" alt="" hidden>
        <div class="empty" id="stageEmpty" hidden></div>
        <div class="badge" id="badge" hidden><span id="badgeL"></span><span id="badgeR"></span></div>
        <div class="msg2" id="stageMsg"></div>
      </div>
      <canvas class="wave2" id="wave" hidden></canvas>
      <div id="liveCtl"><button class="shutter" id="shutter" aria-label="촬영"></button></div>
      <div class="actions2" id="fileCtl">
        <input type="file" id="cap" class="vh" aria-label="카메라로 촬영"><label for="cap" class="btn primary" id="capWrap">카메라로 촬영</label>
        <input type="file" id="pick" class="vh" aria-label="앨범에서 선택"><label for="pick" class="btn">앨범에서 선택</label>
      </div>
      <p class="status" id="capSt" style="text-align:center"></p>
      <div class="actions2"><button class="btn" id="retake" hidden>다시 찍기</button><button class="btn" id="skip">건너뛰기</button><button class="btn primary" id="next" disabled>다음</button></div>
    </section>

    <!-- SURVEY -->
    <section class="screen" data-s="survey" hidden>
      <div class="stepper" id="stepper2"></div>
      <div><h2 style="margin:0 0 4px;font-size:20px">오늘의 컨디션</h2><p class="note2">측정값과 비교해 기준을 다듬는 데 씁니다. 답하기 싫은 항목은 비워 두세요.</p></div>
      <div class="card"><div class="survey">
        <label class="f" for="qSleep">지난밤 수면<select id="qSleep"><option value="">—</option><option>5시간 미만</option><option>5~7시간</option><option>7시간 이상</option></select></label>
        <label class="f" for="qAlc">어제 음주<select id="qAlc"><option value="">—</option><option>안 함</option><option>조금</option><option>많이</option></select></label>
        <label class="f" for="qSwell">오늘 얼굴 붓기<select id="qSwell"><option value="">—</option><option>없음</option><option>조금</option><option>많이</option></select></label>
        <label class="f" for="qCond">오늘 컨디션<select id="qCond"><option value="">—</option><option>좋음</option><option>보통</option><option>나쁨</option></select></label>
        <label class="f" for="qLiver">검진 간 수치 이상<select id="qLiver"><option value="">응답 안 함</option><option>없음</option><option>있음</option><option>모름</option></select></label>
        <label class="f" for="qAnemia">빈혈 진단 경험<select id="qAnemia"><option value="">응답 안 함</option><option>없음</option><option>있음</option><option>모름</option></select></label>
      </div></div>
      <button class="btn primary cta" id="analyze">결과 보기</button>
    </section>

    <!-- RESULT -->
    <section class="screen" data-s="result" hidden>
      <div class="card" id="report" aria-live="polite"></div>
      <button class="btn cta" id="home2">홈으로</button>
    </section>

    <!-- HISTORY -->
    <section class="screen" data-s="history" hidden>
      <div class="card"><p class="eyebrow">얼굴 나이 추이</p><svg class="spark" id="spark" viewBox="0 0 300 90" preserveAspectRatio="none" role="img" aria-label="얼굴 나이 추이"></svg><p class="note2" id="sparkNote"></p></div>
      <div class="hist" id="hist"></div>
    </section>

    <!-- ADMIN -->
    <section class="screen" data-s="admin" hidden><div class="card" id="admin"></div></section>
  </main>

  <nav class="tabbar" id="tabbar">

/* ---------- AI interpretation ---------- */
async function askAI(ms, age, sex) {
  const h = S.face.health, imgs = [S.faceBlob], names = ['이미지 1: 정면 셀피'];
  if (S.conjBlob) { imgs.push(S.conjBlob); names.push(`이미지 ${imgs.length}: 아래 눈꺼풀 안쪽(결막) 근접 사진`); }
  if (S.hairBlob) { imgs.push(S.hairBlob); names.push(`이미지 ${imgs.length}: 정수리/가르마 사진`); }
  const prompt = `당신은 건강·미용 리포트를 쓰는 의학 에디터입니다. ${names.join(', ')}.
사용자 실제 나이 ${age}세${sex ? ', ' + sex : ''}.
사진에서 픽셀 단위로 계산한 원본 측정값:
${ms.map(m => `- ${m.name}: ${fmt(m.value, m.d)} ${m.unit} (점수 ${fmt(m.score)}/100, ${m.band})`).join('\n')}
- 눈 흰자 노란기 b*(조명 보정) ${fmt(h.scleraYellow, 1)}, 눈 흰자 붉은기 a* ${fmt(h.scleraRed, 1)}, 장면 색온도 b* ${fmt(h.cast, 1)}
- 볼 b* ${fmt(h.skinYellow, 1)}, 입술 a* ${fmt(h.lipA, 1)} b* ${fmt(h.lipB, 1)}, 볼·콧등−이마 a* ${fmt(h.malar, 1)}, 눈꺼풀 b* 초과분 ${fmt(h.lidYellow, 1)}
${S.conj ? `- 결막 붉은기 a* ${fmt(S.conj.raw.conjRed, 1)}` : ''}${S.vital ? `\n- 영상: 심박 ${fmt(S.vital.hr)}bpm, 호흡 ${fmt(S.vital.rr)}회/분, 스트레스 ${fmt(S.vital.stress)}/100` : ''}

할 일:
1) 보이는 나이(얼굴 나이)를 정수로 추정하고, 나이를 올리거나 내린 요인 3~4개를 "+1", "-2" 형식과 함께 쓰세요.
2) 아래 시각 징후를 사진에서 직접 관찰해 각각 "보임" / "약간 보임" / "안 보임" / "판단 불가" 중 하나로 답하세요. 조명·화장·필터·각도 때문에 확신할 수 없으면 "판단 불가"를 쓰세요. 측정값은 참고만 하고 사진 관찰을 우선하세요.
   scleraYellow(눈 흰자 노란기), conjPale(눈꺼풀 안쪽 창백, 결막 사진이 없으면 판단 불가), lipColor(입술 창백·푸른기), xanthelasma(눈꺼풀 안쪽 노란 반점), arcus(각막 주변 흰 고리), earlobeCrease(귓불 대각선 주름, 귀가 안 보이면 판단 불가), grayHair(흰머리가 눈에 띔), puffiness(얼굴·눈 주변 붓기), malarRash(볼·콧등 나비 모양 붉은기), facialDroop(입꼬리·눈꺼풀 한쪽 처짐), moonFace(둥글고 꽉 찬 얼굴), eyeBulging(눈 돌출)
3) 피부·모발 지표 해설 한 줄씩 (key: hydration, oil, redness, darkCircle, evenness, wrinkle, hair).
4) 오늘부터 할 수 있는 구체적인 관리 팁 3개.
5) 결과 요약 제목(20자 이내)과 2문장 요약.

규칙: 질병 이름을 진단처럼 말하지 마세요. "~해 보여요", "검사를 권해요" 같은 표현만 쓰세요. 외모를 깎아내리지 말고 따뜻하게 쓰세요. 사진이 흐리거나 필터·화장이 강하면 photoQuality를 "poor"로 하세요. 한국어로 쓰세요.

다음 JSON 하나로만 답하세요:
{"apparentAge":34,"ageFactors":[{"feature":"눈가 잔주름","years":"+1","note":"..."}],"signs":{"scleraYellow":"안 보임","conjPale":"판단 불가","lipColor":"안 보임","xanthelasma":"안 보임","arcus":"안 보임","earlobeCrease":"판단 불가","grayHair":"안 보임","puffiness":"안 보임","malarRash":"안 보임","facialDroop":"안 보임","moonFace":"안 보임","eyeBulging":"안 보임"},"headline":"...","summary":"...","comments":{"hydration":"...","oil":"...","redness":"...","darkCircle":"...","evenness":"...","wrinkle":"...","hair":"..."},"tips":["...","...","..."],"photoQuality":"good","qualityNote":""}`;
  return sampleFn.json(prompt, { images: imgs });
}

/* ---------- pilot data store ---------- */
async function saveRun(rec) {
  if (!db || !uid) return 'nostore';
  try {
    await db.collection(`pilot/${uid}/runs`).add(rec);
    await db.doc(`pilot/${uid}`).set({ lastAt: rec.at, age: rec.age, sex: rec.sex, runs: S.history.length + 1 });
    S.history.unshift(rec); return 'saved';
  } catch (e) { return e?.code === 'invalid_argument' ? 'denied' : 'failed'; }
}

    const ys = pts.flatMap(h => [h.ai.apparentAge, h.age]), lo = Math.min(...ys) - 2, hi = Math.max(...ys) + 2, X = i => 10 + i * 280 / (pts.length - 1), Y = v => 80 - (v - lo) / (hi - lo) * 70;
    $('spark').innerHTML = `<polyline fill="none" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.5" points="${pts.map((h, i) => `${X(i)},${Y(h.age)}`).join(' ')}"/>
      <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map((h, i) => `${X(i)},${Y(h.ai.apparentAge)}`).join(' ')}"/>
      ${pts.map((h, i) => `<circle cx="${X(i)}" cy="${Y(h.ai.apparentAge)}" r="3.5" fill="var(--accent)"/>`).join('')}`;
    $('sparkNote').textContent = `초록 실선: 얼굴 나이 · 점선: 실제 나이 · ${pts.length}회`;
  } else { $('spark').innerHTML = ''; $('sparkNote').textContent = '2회 이상 측정하면 추이가 그려져요.'; }
  $('hist').innerHTML = H.map(h => { const fl = (h.signals || []).filter(s => ['watch', 'check', 'urgent'].includes(s.tier));
    return `<div class="hrow"><b>${h.ai?.apparentAge ?? '—'}</b><div><span class="d">${esc(new Date(h.at).toLocaleString('ko-KR'))}</span><br>${fl.length ? `확인해 볼 신호 ${fl.length}개` : '눈에 띄는 신호 없음'}${h.vital ? ` · 심박 ${fmt(h.vital.hr)}` : ''}</div><span class="chip ${fl.some(s => s.tier === 'check' || s.tier === 'urgent') ? 'c' : fl.length ? 'm' : 'g'}">${fl.length ? '관찰' : '양호'}</span></div>`; }).join('');
}

renderHome();

/* ---------- diagnostics: make failures visible on phones ---------- */
const DIAG = { ua: navigator.userAgent.replace(/\(.*?\)/, '').trim().slice(0, 80), secure: String(window.isSecureContext), framed: String(window.top !== window.self),
  gum: navigator.mediaDevices?.getUserMedia ? '있음' : '없음', cam: '미시험', capture: ('capture' in document.createElement('input')) ? '지원' : '미지원' };
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => el.hidden = true, 7000); }
window.addEventListener('error', e => { toast('오류: ' + (e.message || '알 수 없음')); DIAG.lastError = e.message; renderDiag(); });
window.addEventListener('unhandledrejection', e => { const m = e.reason?.message || e.reason?.code || String(e.reason); toast('오류: ' + m); DIAG.lastError = m; renderDiag(); });
function renderDiag() {
  const rows = [['브라우저', DIAG.ua], ['보안 연결(https)', DIAG.secure], ['Claude 화면 안에서 실행', DIAG.framed], ['카메라 API', DIAG.gum], ['실시간 카메라 시험', DIAG.cam],
    ['카메라 앱 촬영(capture)', DIAG.capture], ['AI 판독', sampleFn ? '가능' : '불가'], ['데이터 저장', db && uid ? '가능' : (db ? '로그인 필요' : '불가')], ['최근 오류', DIAG.lastError || '없음']];
  $('diagT').innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('');
}
$('camTest').onclick = async () => {
  try { const s = await navigator.mediaDevices.getUserMedia({ video: true }); s.getTracks().forEach(t => t.stop()); DIAG.cam = '성공'; }
  catch (e) { DIAG.cam = '실패: ' + (e.name || e.message); }
  renderDiag();
};
$('diag').addEventListener('toggle', renderDiag);
// record why the live camera failed during a step
const _startCam = startCam;
startCam = async (f) => { const ok = await _startCam(f); if (!ok && DIAG.cam === '미시험') DIAG.cam = '실패 (카메라 앱 촬영으로 진행)'; return ok; };
renderDiag();
</script>
</body></html>
