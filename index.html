<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>페이스체크 운영</title>
<style>
:root{--bg:#F5F6F8;--card:#fff;--ink:#16191D;--muted:#5F6670;--line:#E4E7EB;--accent:#12884A;--accent-bg:#E9F7EF;--warn:#9A5B00;--warn-bg:#FFF6E3;--bad:#C8323A;--bad-bg:#FFEFEF;--na:#646D77;--na-bg:#F1F2F4;--focus:#0F7A47}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111316;--card:#1A1D21;--ink:#ECEEF1;--muted:#A3AAB3;--line:#2B3036;--accent:#3CCB85;--accent-bg:#17301F;--warn:#F2B654;--warn-bg:#33270F;--bad:#FF7A80;--bad-bg:#3A1A1C;--na:#A3AAB3;--na-bg:#24282D}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;white-space:nowrap}.top h1 small{color:var(--muted);font-weight:500;margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
nav button[aria-current="page"]{background:var(--accent-bg);color:var(--accent)}
nav button .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
.who{color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center}
main{max-width:1180px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 4px}h3{font-size:15px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{color:var(--muted);font-size:12.5px}.kpi .v{font-size:26px;font-weight:800;margin-top:2px}.kpi.alert .v{color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--bg)}
.tw{overflow-x:auto}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b.ok{background:var(--accent-bg);color:var(--accent)}.b.rv{background:var(--warn-bg);color:var(--warn)}.b.rj{background:var(--bad-bg);color:var(--bad)}.b.na{background:var(--na-bg);color:var(--na)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.d{color:var(--bad);border-color:var(--bad)}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login label{display:block;margin:12px 0 4px;font-weight:600}.login input{width:100%}
.err{color:var(--bad);min-height:20px;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.grid2{grid-template-columns:1fr}main{padding:12px}}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}.dl dt{color:var(--muted)}.dl dd{margin:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
[hidden]{display:none!important}
.modal>div{background:var(--card);border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px}
.modal textarea{width:100%;min-height:70px}
pre{background:var(--bg);padding:12px;border-radius:8px;overflow:auto;font-size:12px;max-height:50vh}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0}
.cmp div{background:var(--bg);border-radius:8px;padding:8px 10px}.cmp b{display:block;font-size:16px}
.demobar{background:var(--warn-bg);color:var(--warn);padding:8px 20px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:8px 0}.evgrid figure{margin:0;background:var(--bg);border-radius:10px;overflow:hidden}.evgrid img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;transform:scaleX(-1)}.evgrid figcaption{padding:6px 8px;font-size:12.5px;display:grid}.evgrid figcaption small{color:var(--muted);font-size:11.5px}
.kv td:first-child{color:var(--muted);width:38%}.modal>div{max-width:760px}
.empty{color:var(--muted);text-align:center;padding:30px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden><div id="modalIn" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   페이스체크 운영 대시보드
   - 배포 전에 아래 두 값을 Supabase 프로젝트 값으로 바꾸세요 (Project Settings → API).
     ANON 키는 공개돼도 되는 키예요. 실제 권한은 DB의 운영진 권한(admin/operator/viewer)으로 막혀 있어요.
   - service_role 키는 절대 여기에 넣지 마세요.
   ===================================================================== */
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';
const PLAT = 'gr';     // 그린리본 통합 회원 공간 (회원번호 GR········)
const IDLE_MIN = 30;   // 이 시간(분) 동안 조작이 없으면 자동 로그아웃 (개인정보 보호)

/* 시연 모드: admin/?demo=1 — Supabase 없이, 같은 브라우저에서 앱을 ?demo=1 로 측정한 기록(이 기기에만 저장)을 보여 줌 */
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const sb = DEMO ? demoClient() : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
function demoClient() {
  const KEY = 'facecheck.demo.db';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null') || { members: {}, rows: [], audit: [] }; } catch { return { members: {}, rows: [], audit: [] }; } };
  const save = db => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
  const ME_ = { id: 'demo', email: 'demo@시연' };
  // 시연: 앱(?demo=1)이 같은 주소의 이 기기 IndexedDB에 저장한 장면 사진을 읽음
  const idbGet = key => new Promise(ok => { try { const q = indexedDB.open('facecheck-img', 1); q.onupgradeneeded = () => q.result.createObjectStore('ev'); q.onsuccess = () => { try { const g = q.result.transaction('ev').objectStore('ev').get(key); g.onsuccess = () => ok(g.result || null); g.onerror = () => ok(null); } catch { ok(null); } }; q.onerror = () => ok(null); } catch { ok(null); } });
  const audit = (db, action, target, detail) => { (db.audit ||= []).push({ id: (db.audit.length || 0) + 1, at: new Date().toISOString(), actor: 'demo', actor_email: ME_.email, action, target, detail }); };
  const tables = db => ({
    members: Object.values(db.members).map(m => ({ platform: PLAT, member_id: m.member_id, first_seen: m.first_seen, last_seen: m.last_seen, birth_year: m.birth_year ?? null, sex: m.sex ?? null, consent_health_at: m.consent_health_at ?? null, consent_face_at: m.consent_face_at ?? null, consent_ver: m.consent_ver ?? '',
      phone_last4: m.phone_last4 ?? null, birth_date: m.birth_date ?? null, first_channel: m.first_channel ?? 'direct', status: 'active', consent_age_at: m.consent_age_at ?? null, consent_terms_at: m.consent_terms_at ?? null, consent_privacy_at: m.consent_privacy_at ?? null, consent_photo_at: m.consent_photo_at ?? null, consent_marketing_at: m.consent_marketing_at ?? null, face_sessions: m.face_sessions || 0, face_enrolled_at: m.face ? (m.face_enrolled_at || m.first_seen) : null, face_updated_at: null, n_accepted: m.n_accepted || 0, n_review: m.n_review || 0, n_rejected: m.n_rejected || 0, latest: m.latest || null })),
    measurements: db.rows.map(r => ({ platform: PLAT, reviewed_by: null, reviewed_at: null, review_note: null, channel: 'direct', ...r })),
    channels: (db.channels || [{ code: 'direct', name: '직접 방문', active: true, note: '플랫폼 코드 없이 들어온 경우', created_at: '2026-10-19T00:00:00Z' }]).map(c => ({ note: null, created_at: '2026-10-19T00:00:00Z', ...c })),
    operators: [{ user_id: 'demo', email: ME_.email, name: '시연', role: 'super', active: true, created_at: new Date().toISOString() }],
    operator_invites: [],
    audit_log: [...(db.audit || [])],
  });
  class Q {
    constructor(t) { this.t = t; this.f = []; this.o = null; this.r = null; this.lim = null; this.opt = {}; this.one = null; }
    select(c, opt) { this.opt = opt || {}; return this; }
    eq(k, v) { this.f.push(x => x[k] === v); return this; }
    is(k, v) { this.f.push(x => (x[k] ?? null) === v); return this; }
    in(k, a) { this.f.push(x => a.includes(x[k])); return this; }
    ilike(k, p) { const s = p.replace(/%/g, '').toLowerCase(); this.f.push(x => String(x[k] || '').toLowerCase().includes(s)); return this; }
    order(k, o = {}) { this.o = [k, o.ascending !== false]; return this; }
    range(a, b) { this.r = [a, b]; return this; }
    limit(n) { this.lim = n; return this; }
    maybeSingle() { this.one = 'maybe'; return this; }
    single() { this.one = 'one'; return this; }
    then(ok, no) { return Promise.resolve(this.run()).then(ok, no); }
    run() {
      let a = tables(load())[this.t] || []; this.f.forEach(fn => { a = a.filter(fn); });
      const count = a.length;
      if (this.o) { const [k, asc] = this.o; a = [...a].sort((x, y) => { const p = x[k] ?? '', q = y[k] ?? ''; return (p > q ? 1 : p < q ? -1 : 0) * (asc ? 1 : -1); }); }
      if (this.r) a = a.slice(this.r[0], this.r[1] + 1); if (this.lim) a = a.slice(0, this.lim);
      if (this.opt.head) return { data: null, count, error: null };
      if (this.one) return a.length || this.one === 'maybe' ? { data: a[0] || null, error: null } : { data: null, error: { message: '기록이 없어요' } };
      return { data: a, count, error: null };
    }
  }
  const R = {
    my_role: () => 'super',
    invite_operator: () => { throw new Error('시연 모드에서는 운영진을 등록할 수 없어요'); },
    remove_operator: () => { throw new Error('시연 모드에서는 운영진을 해제할 수 없어요'); },
    log_view: (a, db) => { audit(db, 'view_member', 'gr:' + a.p_member, null); save(db); },
    dashboard_stats: (a, db) => {
      const rows = db.rows, now = Date.now(), day = t => new Date(new Date(t).getTime() + 9 * 3600e3).toISOString().slice(0, 10), today = day(now);
      const by = []; for (let i = (a.p_days || 14) - 1; i >= 0; i--) { const d = day(now - i * 864e5), rs = rows.filter(r => day(r.measured_at) === d);
        by.push({ day: d, accepted: rs.filter(r => r.status === 'accepted').length, review: rs.filter(r => r.status === 'review').length, rejected: rs.filter(r => r.status === 'rejected').length, finger: rs.filter(r => r.kind === 'finger').length }); }
      const reasons = {}; rows.filter(r => r.status !== 'accepted').forEach(r => { const k = r.identity?.reason || '?'; reasons[k] = (reasons[k] || 0) + 1; });
      const ms = Object.values(db.members);
      return { members: ms.length, members_new_7d: ms.filter(m => now - new Date(m.first_seen) < 7 * 864e5).length, active_30d: new Set(rows.filter(r => r.status === 'accepted').map(r => r.member_id)).size,
        channels: tables(db).channels.map(c => ({ code: c.code, name: c.name, members: ms.filter(m => (m.first_channel || 'direct') === c.code).length, measured_30d: rows.filter(r => (r.channel || 'direct') === c.code).length })),
        measured_today: rows.filter(r => day(r.measured_at) === today).length, review_open: rows.filter(r => r.status === 'review' && !r.reviewed_at).length, rejected_30d: rows.filter(r => r.status === 'rejected').length, enrolled: ms.filter(m => m.face).length, by_day: by, reasons };
    },
    review_measurement: (a, db) => {
      if ((a.p_note || '').trim().length < 2) throw new Error('검토 사유를 적어 주세요');
      const r = db.rows.find(x => x.id === a.p_id); if (!r) throw new Error('기록이 없습니다'); if (r.status === 'accepted') throw new Error('이미 반영된 기록입니다');
      const m = db.members[r.member_id], was = r.status; r.status = a.p_decision === 'accept' ? 'accepted' : 'rejected'; r.reviewed_at = new Date().toISOString(); r.review_note = a.p_note;
      if (m) { m['n_' + was]--; m['n_' + r.status]++; if (r.status === 'accepted') m.latest = { ...(m.latest || {}), ...r.summary, measured_at: r.measured_at, kind: r.kind }; }
      audit(db, 'review_' + a.p_decision, 'gr:' + r.member_id, { note: a.p_note }); save(db); return { ok: true };
    },
    reset_face: (a, db) => { const m = db.members[a.p_member]; if (!m) throw new Error('회원이 없습니다'); m.face = null; m.face_sessions = 0; audit(db, 'reset_face', 'gr:' + a.p_member, { reason: a.p_reason }); save(db); return { ok: true }; },
    delete_member: (a, db) => { const n = db.rows.filter(r => r.member_id === a.p_member).length; delete db.members[a.p_member]; db.consents = (db.consents || []).filter(c => c.member_id !== a.p_member); for (const [k, v] of Object.entries(db.phones || {})) if (v === a.p_member) delete db.phones[k]; for (const [k, v] of Object.entries(db.sessions || {})) if (v === a.p_member) delete db.sessions[k]; db.rows = db.rows.filter(r => r.member_id !== a.p_member); audit(db, 'delete_member', 'gr:' + a.p_member, { reason: a.p_reason, measurements: n }); save(db); return { ok: true, deleted_measurements: n }; },
    export_measurements: (a, db) => { const f = new Date(a.p_from), t = new Date(a.p_to), rows = tables(db).measurements.filter(r => r.status === 'accepted' && new Date(r.measured_at) >= f && new Date(r.measured_at) <= t); audit(db, 'export', null, { rows: rows.length }); save(db); return rows; },
    set_operator: () => { throw new Error('시연 모드에서는 운영진 권한을 바꿀 수 없어요'); },
    upsert_channel: (a, db) => {
      if (!/^[a-z0-9_-]{2,32}$/.test(a.p_code || '')) throw new Error('코드는 영문 소문자·숫자·-·_ 2~32자예요'); if (!(a.p_name || '').trim()) throw new Error('플랫폼 이름을 적어 주세요');
      db.channels = tables(db).channels; const c = db.channels.find(x => x.code === a.p_code); if (c) Object.assign(c, { name: a.p_name.trim(), active: a.p_active !== false, note: a.p_note ?? null }); else db.channels.push({ code: a.p_code, name: a.p_name.trim(), active: a.p_active !== false, note: a.p_note ?? null, created_at: new Date().toISOString() });
      audit(db, 'upsert_channel', a.p_code, { name: a.p_name, active: a.p_active }); save(db); return { ok: true };
    },
    member_consents: (a, db) => { audit(db, 'view_consents', 'gr:' + a.p_member, null); save(db); return (db.consents || []).filter(c => c.member_id === a.p_member).map((c, i) => ({ id: i + 1, platform: PLAT, ...c })).reverse(); },
    get_measurement_images: async (a, db) => {
      const r = db.rows.find(x => x.id === a.p_id); if (!r) throw new Error('기록이 없습니다'); if (r.img_hidden) return [];
      const ev = await idbGet(r.client_id); audit(db, 'view_images', 'gr:' + r.member_id, { measurement: r.id, n: ev?.items?.length || 0 }); save(db);
      return (ev?.items || []).map(x => ({ kind: x.kind, src: x.src }));
    },
  };
  return {
    from: t => new Q(t),
    rpc: async (fn, a) => { const db = load(); try { return { data: await R[fn](a || {}, db), error: null }; } catch (e) { return { data: null, error: { message: e.message } }; } },
    auth: { getSession: async () => ({ data: { session: { user: ME_ } } }), signInWithPassword: async () => ({ error: null }), signInWithOtp: async () => ({ error: null }), verifyOtp: async () => ({ error: null }), signOut: async () => ({}), onAuthStateChange: () => {} },
  };
}
function demoSample() {
  const KEY = 'facecheck.demo.db'; let db; try { db = JSON.parse(localStorage.getItem(KEY) || 'null') || { members: {}, rows: [], audit: [] }; } catch { db = { members: {}, rows: [], audit: [] }; }
  const rnd = (a, b) => a + Math.random() * (b - a), id = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
  const people = [['GR90000001', 1968, 'f', 'direct'], ['GR90000002', 1975, 'm', 'pharm'], ['GR90000003', 1982, 'f', 'pharm'], ['GR90000004', 1990, 'm', 'insure'], ['GR90000005', 1959, 'f', 'direct'], ['GR90000006', 1987, 'f', 'insure']];
  db.channels = db.channels || [{ code: 'direct', name: '직접 방문', active: true, note: '플랫폼 코드 없이 들어온 경우', created_at: '2026-10-19T00:00:00Z' }];
  [['pharm', 'OO약국 앱(샘플)'], ['insure', 'OO보험 앱(샘플)']].forEach(([code, name]) => { if (!db.channels.some(c => c.code === code)) db.channels.push({ code, name, active: true, note: '시연 샘플', created_at: new Date().toISOString() }); });
  db.consents = db.consents || [];
  people.forEach(([mid, by, sx, ch], pi) => {
    const t0 = new Date(Date.now() - 13 * 864e5).toISOString();
    ['age', 'terms', 'privacy', 'health', 'face', ...(pi % 2 ? [] : ['photo']), ...(pi % 3 ? [] : ['marketing'])].forEach(k => db.consents.push({ member_id: mid, kind: k, version: '2026-10-19', agreed: true, at: t0, channel: ch }));
    const age = 2026 - by, m = db.members[mid] = { member_id: mid, first_seen: t0, birth_year: by, birth_date: `${by}-0${1 + pi}-1${pi}`, phone_last4: String(3100 + pi * 7), first_channel: ch, sex: sx, consent_age_at: t0, consent_terms_at: t0, consent_privacy_at: t0, consent_health_at: t0, consent_face_at: t0, consent_photo_at: pi % 2 ? null : t0, consent_marketing_at: pi % 3 ? null : t0, consent_ver: '2026-10-19', face: [0], face_sessions: 1, face_enrolled_at: new Date(Date.now() - 13 * 864e5).toISOString(), n_accepted: 0, n_review: 0, n_rejected: 0, latest: null };
    const n = 3 + (pi % 3);
    for (let k = 0; k < n; k++) {
      const at = new Date(Date.now() - (13 - k * 3 - pi % 2) * 864e5 - rnd(0, 6) * 3600e3).toISOString();

        <div class="pcmp" data-pc="${r.id}"></div>
        <div class="row"><input type="text" placeholder="결정 사유 (예: 회원 확인 결과 본인)" style="flex:1;min-width:200px" data-note><button class="btn p" data-dec="accept">회원 기록에 반영</button><button class="btn d" data-dec="reject">폐기</button><button class="btn" data-open="${esc(r.member_id)}">회원 보기</button></div><p class="err small" data-err style="min-height:0;margin:6px 0 0"></p></div>`; }).join('') || '<div class="card"><p class="empty">검토할 측정이 없어요</p></div>'}`;
  // 사진 비교: 이번 측정 정면 사진 vs 같은 회원의 최근 반영된(사진 있는) 측정 정면 사진
  const { data: withImg } = mids.length ? await sb.from('measurements').select('id,member_id,measured_at,summary').in('member_id', mids).eq('status', 'accepted').order('measured_at', { ascending: false }).limit(20 * mids.length) : { data: [] };
  for (const r of data || []) {
    const box = document.querySelector(`[data-pc="${r.id}"]`); if (!box || !(r.summary?.img_n) || r.img_hidden) continue;
    const ref = (withImg || []).find(x => x.member_id === r.member_id && x.summary?.img_n && !x.img_hidden);
    try {
      const cur = (await loadImages(r)).find(x => x.kind === 'front'), old = ref ? (await loadImages(ref)).find(x => x.kind === 'front') : null;
      box.innerHTML = `<div class="evgrid" style="grid-template-columns:repeat(2,minmax(0,180px))">${cur ? `<figure><img src="${cur.src}" alt="이번 측정 정면"><figcaption><b>이번 측정</b><small>${fmtT(r.measured_at)}</small></figcaption></figure>` : ''}${old ? `<figure><img src="${old.src}" alt="최근 반영 측정 정면"><figcaption><b>최근 반영된 측정</b><small>${fmtT(ref.measured_at)}</small></figcaption></figure>` : '<p class="small muted">비교할 이전 사진이 없어요</p>'}</div>`;
    } catch {}
  }
  document.querySelectorAll('[data-rv]').forEach(c => {
    c.querySelectorAll('[data-dec]').forEach(b => b.onclick = async () => { const note = c.querySelector('[data-note]').value.trim(); if (note.length < 2) { c.querySelector('[data-err]').textContent = '결정 사유를 적어 주세요.'; return; }
      b.disabled = true; try { await rpc('review_measurement', { p_id: c.dataset.rv, p_decision: b.dataset.dec, p_note: note }); toast(b.dataset.dec === 'accept' ? '회원 기록에 반영했어요' : '폐기했어요'); c.remove(); refreshReviewCount(); } catch (e) { c.querySelector('[data-err]').textContent = e.message; b.disabled = false; } });
    c.querySelector('[data-open]').onclick = e => go('members:' + encodeURIComponent(e.target.dataset.open)); });
}

/* ---------- 제휴 플랫폼 링크 ---------- */
async function channels() {
  const [list, st] = await Promise.all([loadChannels(), rpc('dashboard_stats', { p_days: 1 })]);
  const S = Object.fromEntries((st.channels || []).map(c => [c.code, c])), base = new URL('../', location.href.split('#')[0].split('?')[0]).href;
  const linkOf = c => c === 'direct' ? base : `${base}?p=${c}`;
  $('main').innerHTML = `<h2>제휴 플랫폼</h2><p class="sub">제휴 앱·웹에 걸 링크예요. 링크 끝의 <b>?p=코드</b>로 어디서 들어왔는지만 기록하고, <b>회원 정보와 측정 결과는 플랫폼에 주지 않아요.</b> 같은 사람이 다른 플랫폼으로 들어와도 같은 회원번호로 쌓여요. 중지하면 그 코드는 ‘직접 방문’으로 기록돼요.</p>
    <div class="card"><div class="tw"><table><thead><tr><th>플랫폼</th><th>코드</th><th>링크</th><th style="text-align:right">회원</th><th style="text-align:right">30일 측정</th><th>상태</th>${can('admin') ? '<th></th>' : ''}</tr></thead><tbody>
    ${list.map(c => `<tr data-c="${esc(c.code)}"><td>${can('admin') && c.code !== 'direct' ? `<input type="text" value="${esc(c.name)}" data-n style="width:150px">` : `<b>${esc(c.name)}</b>`}${c.note ? `<div class="small muted">${esc(c.note)}</div>` : ''}</td><td class="small">${esc(c.code)}</td>
      <td class="small"><code>${esc(linkOf(c.code))}</code> <button class="btn small" data-copy="${esc(linkOf(c.code))}">복사</button></td><td style="text-align:right">${S[c.code]?.members ?? 0}</td><td style="text-align:right">${S[c.code]?.measured_30d ?? 0}</td>
      <td>${can('admin') && c.code !== 'direct' ? `<label><input type="checkbox" data-a ${c.active ? 'checked' : ''}> 사용</label>` : c.active ? '사용' : '<span class="muted">중지</span>'}</td>${can('admin') ? `<td>${c.code !== 'direct' ? '<button class="btn small" data-save>저장</button>' : ''}</td>` : ''}</tr>`).join('')}</tbody></table></div></div>
    ${can('admin') ? `<div class="card"><h3>새 플랫폼 링크 만들기</h3><div class="row"><label>플랫폼 이름 <input type="text" id="chN" placeholder="예: OO약국 앱"></label><label>코드 <input type="text" id="chC" placeholder="예: oopharm" style="width:140px"></label><label>메모 <input type="text" id="chM" placeholder="담당자·계약 등 (선택)"></label><button class="btn p" id="chAdd">만들기</button></div><p class="small muted" style="margin-top:8px">코드는 영문 소문자·숫자·-·_ 2~32자. 만든 뒤에는 바꾸지 말고, 필요하면 새로 만드세요(통계가 이어지도록).</p><p class="err" id="chE"></p></div>` : ''}`;
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('링크를 복사했어요'); } catch { toast(b.dataset.copy); } });
  document.querySelectorAll('tr[data-c] [data-save]').forEach(b => b.onclick = async () => { const tr = b.closest('tr'); try { await rpc('upsert_channel', { p_code: tr.dataset.c, p_name: tr.querySelector('[data-n]').value, p_active: tr.querySelector('[data-a]').checked, p_note: null }); toast('저장했어요'); channels(); } catch (e) { toast(e.message); } });
  if ($('chAdd')) $('chAdd').onclick = async () => { const code = $('chC').value.trim().toLowerCase();
    if (CHN[code]) { $('chE').textContent = '이미 있는 코드예요.'; return; }
    try { await rpc('upsert_channel', { p_code: code, p_name: $('chN').value, p_active: true, p_note: $('chM').value.trim() || null }); toast('만들었어요. 링크를 복사해 제휴처에 전달하세요.'); channels(); } catch (e) { $('chE').textContent = e.message; } };
}

/* ---------- 운영진 (관리자) ---------- */
async function ops() {
  const [{ data, error }, { data: inv }] = await Promise.all([sb.from('operators').select('*').order('created_at'), sb.from('operator_invites').select('*').order('invited_at')]); if (error) throw error;
  const isSuper = ME.role === 'super', mine = isSuper ? ['admin', 'operator', 'viewer'] : ['operator', 'viewer'];
  const editable = o => o.role !== 'super' && o.user_id !== ME.user.id && (isSuper || o.role !== 'admin');
  const joined = new Set((data || []).map(o => (o.email || '').toLowerCase())), waiting = (inv || []).filter(i => !joined.has(i.email));
  $('main').innerHTML = `<h2>운영진</h2><p class="sub">운영진은 비밀번호 없이 <b>등록된 이메일로 받은 인증번호</b>로 로그인해요. 아래에서 이메일을 등록하면 그 사람이 운영 화면에서 바로 인증번호를 받아 들어올 수 있어요. ${isSuper ? '관리자 권한은 슈퍼어드민만 줄 수 있어요.' : '관리자 권한은 슈퍼어드민에게 요청하세요.'}</p>
    <div class="card"><h3>운영진 이메일 등록</h3><div class="row"><label>이메일 <input type="email" id="ivE" placeholder="name@green-ribbon.co.kr" style="width:240px"></label><label>이름 <input type="text" id="ivN" style="width:120px"></label>
      <label>권한 <select id="ivR">${mine.map(r => `<option value="${r}">${ROLE_KO[r]}</option>`).join('')}</select></label><button class="btn p" id="ivGo">등록</button></div><p class="err" id="ivErr"></p></div>
    <div class="card"><div class="tw"><table><thead><tr><th>이메일</th><th>이름</th><th>권한</th><th>사용</th><th>등록·첫 로그인</th><th></th></tr></thead><tbody>
    ${(data || []).map(o => editable(o) ? `<tr data-u="${o.user_id}" data-e="${esc(o.email)}"><td>${esc(o.email)}</td><td><input type="text" value="${esc(o.name || '')}" data-name style="width:120px"></td>
      <td><select data-role>${[...new Set([...mine, o.role])].map(r => `<option value="${r}" ${r === o.role ? 'selected' : ''}>${ROLE_KO[r]}</option>`).join('')}</select></td>
      <td><label><input type="checkbox" data-active ${o.active ? 'checked' : ''}> 사용</label></td><td>${fmtD(o.created_at)}</td><td style="white-space:nowrap"><button class="btn small" data-save>저장</button> <button class="btn small d" data-rm>해제</button></td></tr>`
      : `<tr><td>${esc(o.email)}${o.user_id === ME.user.id ? ' <span class="muted small">(나)</span>' : ''}</td><td>${esc(o.name || '')}</td><td><b>${ROLE_KO[o.role] || o.role}</b>${o.role === 'super' ? ' <span class="muted small">(고정)</span>' : ''}</td><td>${o.active ? '사용' : '<span class="muted">중지</span>'}</td><td>${fmtD(o.created_at)}</td><td></td></tr>`).join('')}
    ${waiting.map(i => `<tr data-e="${esc(i.email)}" data-wait><td>${esc(i.email)}</td><td>${esc(i.name || '')}</td><td>${ROLE_KO[i.role]}</td><td><span class="muted">첫 로그인 전</span></td><td>${fmtD(i.invited_at)} 등록</td><td>${isSuper || i.role !== 'admin' ? '<button class="btn small d" data-rm>해제</button>' : ''}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted" style="margin-top:10px">슈퍼어드민: 모든 기능 + 관리자 지정 · 관리자: 모든 기능(운영자·조회 전용 등록) · 운영자: 회원 조회·검토 · 조회 전용: 개요 통계만. 해제하면 그 이메일로는 더 이상 로그인할 수 없어요.</p></div>`;
  $('ivGo').onclick = async () => { $('ivErr').textContent = ''; try { await rpc('invite_operator', { p_email: $('ivE').value, p_role: $('ivR').value, p_name: $('ivN').value }); toast('등록했어요. 그 이메일로 운영 화면에 들어오면 인증번호가 가요.'); ops(); } catch (e) { $('ivErr').textContent = e.message; } };
  document.querySelectorAll('tr[data-u] [data-save]').forEach(b => b.onclick = async () => { const tr = b.closest('tr');
    try { await rpc('set_operator', { p_user: tr.dataset.u, p_role: tr.querySelector('[data-role]').value, p_active: tr.querySelector('[data-active]').checked, p_name: tr.querySelector('[data-name]').value.trim() || null }); toast('저장했어요'); } catch (e) { toast(e.message); ops(); } });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { const tr = b.closest('tr');
    if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = '한 번 더'; return; }
    try { await rpc('remove_operator', { p_email: tr.dataset.e }); toast('해제했어요'); ops(); } catch (e) { toast(e.message); } });
}

/* ---------- 접속 기록 (관리자) ---------- */
const ACT_KO = { invite_operator: '운영진 이메일 등록', remove_operator: '운영진 해제', view_consents: '동의 이력 열람', upsert_channel: '제휴 플랫폼 링크 변경', member_withdraw: '회원 탈퇴(본인 요청 · 앱)', view_images: '측정 사진 열람', view_member: '회원 열람', review_accept: '검토 → 반영', review_reject: '검토 → 폐기', reset_face: '얼굴 초기화', delete_member: '회원 삭제', export: '내보내기', set_operator: '운영진 권한 변경' };
async function audit() {
  const { data, error } = await sb.from('audit_log').select('*').order('at', { ascending: false }).limit(300); if (error) throw error;
  $('main').innerHTML = `<h2>접속 기록</h2><p class="sub">운영진이 회원 정보를 열람·변경·내보낸 기록이에요(개인정보 처리 기록). 최근 300건.</p><div class="card"><div class="tw"><table><thead><tr><th>시각</th><th>운영진</th><th>한 일</th><th>대상</th><th>내용</th></tr></thead><tbody>
    ${(data || []).map(a => `<tr><td>${fmtT(a.at)}</td><td>${esc(a.actor_email || '')}</td><td>${esc(ACT_KO[a.action] || a.action)}</td><td>${esc(a.target || '')}</td><td class="small">${esc(a.detail ? JSON.stringify(a.detail) : '')}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">기록 없음</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- 내보내기 (관리자) ---------- */
async function exportView() {
  const d1 = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10), d2 = new Date().toISOString().slice(0, 10);
  $('main').innerHTML = `<h2>내보내기</h2><p class="sub">회원 기록에 반영된 측정만 내보내요. 내보낸 사실은 접속 기록에 남아요. 받은 파일은 암호가 걸린 곳에 보관하고, 쓰고 나면 지워 주세요.</p>
    <div class="card"><div class="row"><label>시작 <input type="date" id="x1" value="${d1}"></label><label>끝 <input type="date" id="x2" value="${d2}"></label><button class="btn p" id="xcsv">CSV(요약)</button><button class="btn" id="xjson">JSON(원본 포함)</button></div><p class="small muted" id="xst" style="margin-top:8px"></p></div>`;
  const run = async fmt => { $('xst').textContent = '만드는 중…';
    try { const from = new Date($('x1').value + 'T00:00:00+09:00').toISOString(), to = new Date($('x2').value + 'T23:59:59+09:00').toISOString();
      const rows = await rpc('export_measurements', { p_from: from, p_to: to }); let blob, name;
      if (fmt === 'csv') { const keys = [...new Set(rows.flatMap(r => Object.keys(r.summary || {})))];
        const head = ['member_id', 'channel', 'kind', 'measured_at', 'identity_reason', 'identity_d', ...keys.map(k => 'summary.' + k)];
        const q = v => { const s = v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
        const lines = [head.join(','), ...rows.map(r => [r.member_id, r.channel, r.kind, r.measured_at, r.identity?.reason, r.identity?.d, ...keys.map(k => r.summary?.[k])].map(q).join(','))];
        blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }); name = `facecheck_${$('x1').value}_${$('x2').value}.csv`; }
      else { blob = new Blob([JSON.stringify(rows)], { type: 'application/json' }); name = `facecheck_${$('x1').value}_${$('x2').value}.json`; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      $('xst').textContent = `${rows.length}건을 내보냈어요.`; } catch (e) { $('xst').textContent = '실패: ' + e.message; } };
  $('xcsv').onclick = () => run('csv'); $('xjson').onclick = () => run('json');
}

if (!DEMO && SUPABASE_URL.includes('YOUR-PROJECT')) $('app').innerHTML = '<div class="login card"><h2>설정이 필요해요</h2><p class="sub">이 파일 안의 SUPABASE_URL과 SUPABASE_ANON_KEY를 Supabase 프로젝트 값으로 바꿔 주세요.</p></div>';
else { sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && ME.user) renderLogin(); }); boot(); }
